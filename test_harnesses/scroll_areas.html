<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <title>Scroll areas</title>
    <style type="text/css" media="screen">
      html, body {
        margin: 0;
        height: 100%;
        font-family: sans-serif;
      }
      body {
        display: flex;
      }
      /* Like chatgpt.com: the page itself doesn't scroll; the sidebar and the chat do. */
      #sidebar {
        width: 220px;
        overflow-y: auto;
        background: #f3f3f3;
        border-right: 1px solid #ccc;
      }
      #sidebar a {
        display: block;
        padding: 6px 10px;
      }
      #main {
        flex: 1;
        overflow-y: auto;
        padding: 0 20px;
      }
      pre {
        overflow-x: auto;
        background: #222;
        color: #eee;
        padding: 10px;
      }
      iframe {
        width: 400px;
        height: 200px;
      }
    </style>
  </head>
  <body>
    <nav id="sidebar"></nav>
    <main id="main">
      <p>
        Press <code>zs</code> to pick which area <code>j</code>/<code>k</code>/<code>h</code>/<code
        >l</code> scroll. The blue outline is the area which scrolls now. Map
        <code>nextScrollArea</code> and <code>previousScrollArea</code> to cycle through them.
      </p>
      <pre id="code"></pre>
      <iframe
        srcdoc="<body style='margin:0'><div style='height:150px;overflow:auto;border:1px solid red'><div style='height:1000px'>Scrolling area in an iframe</div></div></body>"
      ></iframe>
      <div id="chat"></div>
    </main>
    <script>
      const sidebar = document.getElementById("sidebar");
      for (let i = 1; i <= 80; i++) {
        const a = document.createElement("a");
        a.href = "#";
        a.textContent = `Conversation ${i}`;
        sidebar.appendChild(a);
      }
      document.getElementById("code").textContent = Array.from(
        { length: 8 },
        (_, i) => `line ${i}: ` + "const value = someFunction(argument);".repeat(8),
      ).join("\n");
      const chat = document.getElementById("chat");
      for (let i = 1; i <= 60; i++) {
        const p = document.createElement("p");
        p.textContent = `Message ${i}. Lorem ipsum dolor sit amet, consectetur adipiscing elit.`;
        chat.appendChild(p);
      }
    </script>
  </body>
</html>
